<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Multiplicative station weighting pipeline</title>
  <desc id="desc">Six station-level factors combine multiplicatively, followed by correlation and sector penalties, normalization, and a weighted temperature estimate.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="55" y="52" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">From raw observations to normalized influence</text>
  <text x="55" y="82" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">Every factor is inspectable in the estimator output; no black-box attention score is used.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(55,125)">
      <rect width="160" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#1e3a8a">Reliability</text>
      <text x="18" y="57" font-size="18" fill="#2563eb">qᵢ</text>
      <text x="18" y="79" font-size="12" fill="#64748b">frozen station prior</text>
    </g>
    <text x="225" y="183" font-size="24" fill="#64748b">×</text>
    <g transform="translate(250,125)">
      <rect width="160" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#1e3a8a">Freshness</text>
      <text x="18" y="57" font-size="18" fill="#2563eb">f(ageᵢ)</text>
      <text x="18" y="79" font-size="12" fill="#64748b">stale data decays</text>
    </g>
    <text x="420" y="183" font-size="24" fill="#64748b">×</text>
    <g transform="translate(445,125)">
      <rect width="160" height="94" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#115e59">Distance</text>
      <text x="18" y="57" font-size="18" fill="#0f766e">g(dᵢ)</text>
      <text x="18" y="79" font-size="12" fill="#64748b">smooth inverse kernel</text>
    </g>
    <text x="615" y="183" font-size="24" fill="#64748b">×</text>
    <g transform="translate(640,125)">
      <rect width="160" height="94" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#115e59">Advection</text>
      <text x="18" y="57" font-size="18" fill="#0f766e">a(θᵢ, θwind)</text>
      <text x="18" y="79" font-size="12" fill="#64748b">upwind alignment</text>
    </g>
    <text x="810" y="183" font-size="24" fill="#64748b">×</text>
    <g transform="translate(835,125)">
      <rect width="145" height="94" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#9a3412">Radiation</text>
      <text x="18" y="57" font-size="18" fill="#ea580c">s(Sᵢ, vᵢ)</text>
      <text x="18" y="79" font-size="12" fill="#64748b">exposure control</text>
    </g>
    <text x="990" y="183" font-size="24" fill="#64748b">×</text>
    <g transform="translate(1015,125)">
      <rect width="130" height="94" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
      <text x="18" y="31" font-size="15" font-weight="700" fill="#6b21a8">Precision</text>
      <text x="18" y="57" font-size="18" fill="#9333ea">1 / σᵢ</text>
      <text x="18" y="79" font-size="12" fill="#64748b">residual scale</text>
    </g>

    <path d="M600 238 V275" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow3)"/>
    <rect x="375" y="285" width="450" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="400" y="311" font-size="15" font-weight="700" fill="#0f172a">Raw physical-statistical weight</text>
    <text x="400" y="334" font-size="14" fill="#475569">rᵢ = qᵢ · fᵢ · gᵢ · aᵢ · sᵢ / max(σᵢ, 0.5)</text>

    <path d="M375 316 H300" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow3-left)"/>
    <rect x="55" y="275" width="225" height="82" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="75" y="305" font-size="15" font-weight="700" fill="#991b1b">Redundancy penalties</text>
    <text x="75" y="330" font-size="14" fill="#7f1d1d">mgroup⁻ᵅ · msector⁻ᵝ</text>
    <text x="75" y="350" font-size="12" fill="#64748b">duplicates cannot vote as peers</text>

    <path d="M825 316 H890" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow3)"/>
    <rect x="905" y="275" width="240" height="82" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="925" y="305" font-size="15" font-weight="700" fill="#1e3a8a">Normalize</text>
    <text x="925" y="330" font-size="14" fill="#1e40af">wᵢ = rᵢ* / Σⱼ rⱼ*</text>
    <text x="925" y="350" font-size="12" fill="#64748b">Σᵢ wᵢ = 1</text>

    <path d="M600 347 V390" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow3)"/>
    <rect x="375" y="402" width="450" height="72" rx="12" fill="#0f172a"/>
    <text x="400" y="433" font-size="17" font-weight="700" fill="#ffffff">Canonical estimate</text>
    <text x="400" y="458" font-size="17" fill="#93c5fd">X(t) = Σᵢ wᵢ(t) · T̃ᵢ(t)</text>
  </g>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arrow3-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748b"/></marker>
  </defs>
</svg>
