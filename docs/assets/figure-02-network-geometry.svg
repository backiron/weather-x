<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic station geometry and final normalized weights</title>
  <desc id="desc">Five synthetic personal weather stations surround a target. Circle sizes show final normalized weights, and a wind arrow shows advection from southwest to northeast.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="55" y="52" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Geometry, wind alignment, and correlated coverage</text>
  <text x="55" y="82" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">Synthetic demonstration at 18:00 UTC. Marker area is proportional to final normalized station weight.</text>

  <g transform="translate(85,105)" font-family="Inter,Arial,sans-serif">
    <rect width="760" height="560" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="380" cy="280" r="92" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="380" cy="280" r="184" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <circle cx="380" cy="280" r="255" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="1.5">
      <line x1="380" y1="25" x2="380" y2="535"/><line x1="125" y1="280" x2="635" y2="280"/>
      <line x1="200" y1="100" x2="560" y2="460"/><line x1="560" y1="100" x2="200" y2="460"/>
    </g>
    <text x="370" y="20" font-size="13" fill="#64748b">N</text><text x="650" y="285" font-size="13" fill="#64748b">E</text>
    <text x="370" y="555" font-size="13" fill="#64748b">S</text><text x="95" y="285" font-size="13" fill="#64748b">W</text>
    <text x="470" y="268" font-size="12" fill="#94a3b8">1 mi</text><text x="560" y="268" font-size="12" fill="#94a3b8">2 mi</text>

    <path d="M88 458 L228 318" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#wind-arrow)"/>

    <circle cx="380" cy="280" r="19" fill="#0f172a"/>
    <circle cx="380" cy="280" r="7" fill="#ffffff"/>
    <text x="404" y="275" font-size="16" font-weight="700" fill="#0f172a">Target</text>
    <text x="404" y="295" font-size="13" fill="#64748b">X = 88.49 F</text>

    <circle cx="250" cy="410" r="34" fill="#2563eb" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="2"/>
    <text x="215" y="462" font-size="15" font-weight="700" fill="#1e3a8a">S01 · 26.1%</text>
    <text x="215" y="482" font-size="13" fill="#475569">upwind · group SW-A</text>

    <circle cx="285" cy="382" r="31" fill="#60a5fa" fill-opacity="0.9" stroke="#1e40af" stroke-width="2"/>
    <text x="325" y="385" font-size="15" font-weight="700" fill="#1e3a8a">S02 · 21.3%</text>
    <text x="325" y="405" font-size="13" fill="#475569">correlated with S01</text>

    <circle cx="300" cy="120" r="29" fill="#0f766e" fill-opacity="0.86" stroke="#115e59" stroke-width="2"/>
    <text x="175" y="78" font-size="15" font-weight="700" fill="#115e59">S03 · 18.5%</text>
    <text x="175" y="98" font-size="13" fill="#475569">older observation</text>

    <circle cx="545" cy="205" r="31" fill="#14b8a6" fill-opacity="0.86" stroke="#0f766e" stroke-width="2"/>
    <text x="585" y="202" font-size="15" font-weight="700" fill="#115e59">S04 · 21.3%</text>
    <text x="585" y="222" font-size="13" fill="#475569">downwind penalty</text>

    <circle cx="500" cy="448" r="24" fill="#ea580c" fill-opacity="0.84" stroke="#9a3412" stroke-width="2"/>
    <text x="532" y="445" font-size="15" font-weight="700" fill="#9a3412">S05 · 12.8%</text>
    <text x="532" y="465" font-size="13" fill="#475569">high solar · low ventilation</text>

    <rect x="20" y="506" width="212" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <path d="M38 529 L66 511" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#wind-arrow-small)"/>
    <text x="82" y="529" font-size="13" font-weight="700" fill="#1d4ed8">Wind from 230° · 8 mph</text>
  </g>

  <g transform="translate(885,130)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">Why raw station count is misleading</text>
    <rect x="0" y="28" width="260" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="60" font-size="12" fill="#64748b">Configured sensors</text>
    <text x="20" y="108" font-size="38" font-weight="700" fill="#0f172a">5</text>
    <text x="140" y="60" font-size="12" fill="#64748b">Effective sample</text>
    <text x="140" y="108" font-size="38" font-weight="700" fill="#2563eb">4.77</text>
    <text x="20" y="132" font-size="11" fill="#64748b">Correlation and unequal weights reduce</text>
    <text x="20" y="146" font-size="11" fill="#64748b">independent information.</text>

    <text x="0" y="205" font-size="18" font-weight="700" fill="#0f172a">Final estimate</text>
    <rect x="0" y="228" width="260" height="180" rx="10" fill="#0f172a"/>
    <text x="22" y="270" font-size="14" fill="#cbd5e1">Weighted center</text>
    <text x="22" y="318" font-size="40" font-weight="700" fill="#ffffff">88.49 F</text>
    <text x="22" y="354" font-size="15" fill="#93c5fd">σ = 0.88 F</text>
    <text x="22" y="384" font-size="15" fill="#cbd5e1">95% interval: 86.77–90.21 F</text>

    <text x="0" y="462" font-size="18" font-weight="700" fill="#0f172a">Interpretation</text>
    <text x="0" y="494" font-size="14" fill="#475569">The map estimates a local field.</text>
    <text x="0" y="518" font-size="14" fill="#475569">It does not reproduce hidden point-</text>
    <text x="0" y="542" font-size="14" fill="#475569">sensor processing deterministically.</text>
  </g>
  <defs>
    <marker id="wind-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="wind-arrow-small" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
